---
- name: Динамически изменить имя хоста
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true

- name: Установить часовой пояс
  community.general.timezone:
    name: "{{ timezone }}"
  become: true

- name: Create swap file
  ansible.builtin.command:
    cmd: "truncate -s {{ swap_size }} {{ swapfile }}"
    creates: "{{ swapfile }}"
  become: true

- name: Установить права на swap-файл
  ansible.builtin.file:
    path: "{{ swapfile }}"
    mode: "0600"
  become: true

- name: Инициализировать swap
  ansible.builtin.command:
    cmd: "mkswap {{ swapfile }}"
  become: true
  when: ansible_facts.swaptotal_mb | int == 0

- name: Включить swap
  ansible.builtin.command:
    cmd: "swapon {{ swapfile }}"
  become: true
  when: ansible_facts.swaptotal_mb | int == 0

- name: Добавить swap в fstab
  ansible.posix.mount:
    name: none
    src: "{{ swapfile }}"
    fstype: swap
    opts: sw
    state: present
  become: true

- name: Install mc
  ansible.builtin.apt:
    name: mc
    state: present
    update_cache: true
  tags: mc
  become: true

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present
  tags: git
  become: true

- name: Install htop
  ansible.builtin.apt:
    name: htop
    state: present
  tags: htop
  become: true

- name: Check disk space
  ansible.builtin.command: df -h
  register: disk_space
  changed_when: false
  tags: always
