---
- name: Динамически изменить имя хоста
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  become: true

- name: Установить часовой пояс
  community.general.timezone:
    name: "{{ timezone }}"
  become: true

- name: Create swap file
  ansible.builtin.command:
    cmd: "truncate -s {{ swap_size }} {{ swapfile }}"
    creates: "{{ swapfile }}"
  become: true
- name: Install additional packages
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop: "{{ packages }}"
  become: true
- name: Установить права на swap-файл
  ansible.builtin.file:
    path: "{{ swapfile }}"
    mode: "0600"
  become: true

- name: Инициализировать swap
  ansible.builtin.command:
    cmd: "mkswap {{ swapfile }}"
  become: true
  when: ansible_facts.swaptotal_mb | int == 0

- name: Включить swap
  ansible.builtin.command:
    cmd: "swapon {{ swapfile }}"
  become: true
  when: ansible_facts.swaptotal_mb | int == 0

- name: Добавить swap в fstab
  ansible.posix.mount:
    name: none
    src: "{{ swapfile }}"
    fstype: swap
    opts: sw
    state: present
  become: true
