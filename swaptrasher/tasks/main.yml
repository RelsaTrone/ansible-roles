---
- name: Check active swap
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false

- name: Disable swap
  ansible.builtin.command:
    cmd: "swapoff {{ swapfile }}"
  become: true
  when: swapfile in active_swap.stdout_lines

- name: Remove swap from fstab
  ansible.posix.mount:
    name: none
    src: "{{ swapfile }}"
    fstype: swap
    state: absent
  become: true

- name: Remove swap file
  ansible.builtin.file:
    path: "{{ swapfile }}"
    state: absent
  become: true
