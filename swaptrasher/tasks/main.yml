---
- name: Check active swap
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: active_swap
  changed_when: false

- name: Set swap file fact
  ansible.builtin.set_fact:
    detected_swap_file: "{{ active_swap.stdout_lines[0] }}"
  when: active_swap.stdout_lines | length > 0

- name: Disable swap
  ansible.builtin.command:
    cmd: "swapoff {{ detected_swap_file }}"
  become: true
  when: detected_swap_file is defined

- name: Remove swap from fstab
  ansible.posix.mount:
    name: none
    src: "{{ detected_swap_file }}"
    fstype: swap
    state: absent
  become: true
  when: detected_swap_file is defined

- name: Remove swap file
  ansible.builtin.file:
    path: "{{ detected_swap_file }}"
    state: absent
  become: true
  when: detected_swap_file is defined
