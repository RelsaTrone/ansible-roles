---
- name: Install nginx package on RedHat
  ansible.builtin.yum:
    name: nginx
    state: present
  when: ansible_os_family == "RedHat"
  become: true

- name: Install nginx package on Debian systems
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  become: true

- name: Ensure nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  become: true

- name: Disable default site if required
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  when: not nginx_default_sites_enabled
  become: true

- name: Deploy nginx configuration file
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_conf_path }}"
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: 'nginx -t -c %s'
  notify:
    - reload nginx
  become: true

- name: Ensure htpasswd file exists
  ansible.builtin.file:
    path: /etc/nginx/.htpasswd
    state: touch
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Ensure apache2-utils is installed (for htpasswd)
  ansible.builtin.apt:
    name: apache2-utils
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  become: true

- name: Check if users exist in htpasswd
  ansible.builtin.shell: "grep -q '^{{ item.name }}:' /etc/nginx/.htpasswd"
  loop: "{{ nginx_auth_users }}"
  register: user_check
  failed_when: false
  changed_when: false
  become: true

- name: Add missing users to htpasswd
  ansible.builtin.command: "htpasswd -bB /etc/nginx/.htpasswd {{ item.item.name }} {{ item.item.password }}"
  loop: "{{ user_check.results }}"
  when: item.rc != 0
  changed_when: true
  notify:
    - reload nginx
  become: true
