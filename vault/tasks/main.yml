---
- name: Ensure Vault data directory exists
  ansible.builtin.file:
    path: "{{ vault_data_dir }}"
    state: directory
    mode: '0755'
  become: true

- name: Deploy docker-compose.yml for Vault
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/vault/docker-compose.yml
    mode: '0644'
  become: true

- name: Start Vault container
  community.docker.docker_compose:
    project_src: /opt/vault
    state: present
  become: true
